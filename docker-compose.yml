services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: library_management
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  spring:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/library_management
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8000:8080"
    depends_on:
      mysql:
        condition: service_healthy